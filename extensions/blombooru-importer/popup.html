<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blombooru Web Importer</title>
  <style>
    body { font-family: Arial, sans-serif; width: 320px; margin: 12px; }
    label { display: block; font-size: 12px; margin-bottom: 4px; }
    input { width: 100%; margin-bottom: 10px; box-sizing: border-box; padding: 6px; }
    button { width: 100%; padding: 8px; }
    #status { margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <label for="baseUrl">Blombooru Base URL</label>
  <input id="baseUrl" placeholder="http://localhost:8000" />

  <label for="apiKey">Blombooru API Key (blom_...)</label>
  <input id="apiKey" type="password" placeholder="blom_xxxxxxxxx" />

  <button id="saveBtn">Save</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
